name: render-deploy
# Deploy the backend to Render on every push to main. The repo is linked
# to Render by URL only (no GitHub App webhook), so this workflow is the
# trigger. Needs the RENDER_API_KEY repo secret.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST \
            "https://api.render.com/v1/services/srv-dbt2sk56e07s73b9b4d0/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
