<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f2ed">
  <meta name="description" content="IGNIS — scientific exploration of combustion in microgravity.">
  <title>IGNIS — Microgravity Science</title>
  <link rel="stylesheet" href="styles.css">
  <script src="hero.js" defer></script>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="ignis-title">
      <canvas class="stars" aria-hidden="true"></canvas>
      <canvas class="heat-surface" aria-hidden="true"></canvas>
      <div class="shade" aria-hidden="true"></div>
      <header class="topbar">
        <div class="topbar-inner">
          <span class="topbar-brand" aria-hidden="true">IGNIS</span>
          <button id="theme-toggle" type="button" aria-label="Enable dark mode" aria-pressed="false">
            <svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="sun-rays" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 1.8v2.1M12 20.1v2.1M4.8 4.8l1.5 1.5m11.4 11.4 1.5 1.5M1.8 12h2.1m16.2 0h2.1M4.8 19.2l1.5-1.5M17.7 6.3l1.5-1.5"/></g><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
            <svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.1 15.4A8.5 8.5 0 0 1 8.6 3.9 8.7 8.7 0 1 0 20.1 15.4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>
      <div class="identity">
        <h1 id="ignis-title">IGNIS</h1>
      </div>
    </section>
    <section id="estaleiro" class="shipyard-section" aria-label="IGNIS orbital shipyard">
      <img src="../frontend/public/assets/space/estaleiro/station_foreground.png" alt="IGNIS orbital shipyard in space">
    </section>
  </main>
</body>
</html>
